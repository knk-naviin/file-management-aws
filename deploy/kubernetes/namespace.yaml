apiVersion: v1
kind: Namespace
metadata:
  name: secure-docs
  labels:
    app.kubernetes.io/part-of: secure-document-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-docs-config
  namespace: secure-docs
data:
  AWS_REGION: REPLACE_WITH_AWS_REGION
  S3_BUCKET: REPLACE_WITH_PRIVATE_BUCKET
  KMS_KEY_ID: REPLACE_WITH_KMS_KEY_ARN
  AUTH_SERVICE_URL: http://auth-service:8081
  DOCUMENT_SERVICE_URL: http://document-service:8082
  DB_URL: jdbc:postgresql://REPLACE_WITH_PRIVATE_DATABASE:5432/secure_docs
  REDIS_HOST: REPLACE_WITH_PRIVATE_REDIS
  CORS_ALLOWED_ORIGINS: https://REPLACE_WITH_FRONTEND_HOST
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: secure-docs
type: Opaque
stringData:
  DB_USERNAME: REPLACE_WITH_DATABASE_USERNAME
  DB_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  JWT_PRIVATE_KEY_BASE64: REPLACE_WITH_AUTH_RSA_PRIVATE_KEY_BASE64
  JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_RSA_PUBLIC_KEY_BASE64
---
apiVersion: v1
kind: Secret
metadata:
  name: document-service-secrets
  namespace: secure-docs
type: Opaque
stringData:
  DB_USERNAME: REPLACE_WITH_DATABASE_USERNAME
  DB_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_RSA_PUBLIC_KEY_BASE64
