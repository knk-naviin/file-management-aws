services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_docs
      POSTGRES_USER: secure_docs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_docs -d secure_docs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,kms,sns,lambda,logs,apigateway
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/10-aws-resources.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/secure_docs
      DB_USERNAME: secure_docs
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?Run scripts/generate-dev-jwt-keys.ps1 first}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Run scripts/generate-dev-jwt-keys.ps1 first}
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/secure_docs
      DB_USERNAME: secure_docs
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Run scripts/generate-dev-jwt-keys.ps1 first}
      AUTH_SERVICE_URL: http://auth-service:8081
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: secure-document-storage
      S3_ENDPOINT: http://localstack:4566
      KMS_KEY_ID: alias/secure-docs
      KMS_ENDPOINT: http://localstack:4566
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      REDIS_HOST: redis
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Run scripts/generate-dev-jwt-keys.ps1 first}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  localstack-data:
